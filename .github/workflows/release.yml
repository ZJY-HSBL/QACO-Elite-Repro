name: Release v1.0.0 evidence
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Rebuild reproducibility evidence
        run: python -m qaco_elite.experiment --output results --seed 2026 --q-episodes 1200 --ants 50 --iterations 100 --walk-cap 1800
      - name: Zip reproducibility evidence
        run: zip -r qaco-elite-v1.0.0-evidence.zip results -x '*benchmark.log'
      - name: Publish release once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'v1.0.0 already exists; not overwriting immutable version evidence.'
          else
            gh release create v1.0.0 qaco-elite-v1.0.0-evidence.zip --target "$GITHUB_SHA" --title 'v1.0.0 | Q-ACO-Elite reproduction baseline' --notes-file RELEASE_NOTES.md
          fi
